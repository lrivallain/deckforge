name: Feature request
description: Suggest a template, theme, editor feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The presentation problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How deckforge could help. Sketches and example slides are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
