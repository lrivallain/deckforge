name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The lockfile may be generated behind a private npm mirror; resolve
      # the same tarballs (same integrity hashes) from the public registry.
      - name: Use the public npm registry
        run: sed -E -i 's#https://[^"]+/_packaging/[^"]+/npm/registry/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build and check that committed dist/ and examples are up to date
        run: |
          npm run build
          for deck in examples/*/; do node bin/deckforge.js build "$deck"; done
          git diff --exit-code -- dist examples
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node }}
          path: playwright-report
          retention-days: 7

  # Install the packed tarball globally, as a user would, and run the CLI.
  global-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack and install globally
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/deckforge-*.tgz --omit=optional --no-audit --no-fund
      - name: Smoke test the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          deckforge --version
          deckforge new smoke --title Smoke
          deckforge build smoke --runtime inline
          test -s smoke/deck.yaml
          test -s smoke/deck.html
          deckforge new local --title Local
          deckforge build local --runtime local
          test -s local/deck.html
          test -s local/deckforge/deckforge.viewer.js
          deckforge new review --example postmortem
          deckforge build review --check-offline --strip-notes
