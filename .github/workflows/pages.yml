name: Docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - examples/**
      - dist/**
      - CONTRIBUTING.md
      - scripts/docs-demo.js
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - CONTRIBUTING.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated timestamps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile may be generated behind a private npm mirror; resolve
      # the same tarballs (same integrity hashes) from the public registry.
      - name: Use the public npm registry
        run: sed -E -i 's#https://[^"]+/_packaging/[^"]+/npm/registry/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
